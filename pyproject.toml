[project]
name = "rag-eval-harness"
version = "0.1.0"
description = "Retrieval-augmented generation with an offline evaluation harness: TF-IDF retrieval, pluggable LLM, retrieval + generation metrics. Runs with zero API keys."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.4",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
